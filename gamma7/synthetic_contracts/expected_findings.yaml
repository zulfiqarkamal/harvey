contract_04_saas:
  supplier: "ComplianceTools International BV"
  classification: "non_critical"
  expected_gaps:
    - requirement_id: ART30-001
      expected_status: ambiguous
      reason: >
        Section 8.5 names sub-processors (Azure, Datadog, Zendesk) with 30-day change notification
        but NO prior written authorisation requirement and NO right to object.
        Notification-only model is insufficient for DORA sub-contracting controls.
      expected_risk: medium

    - requirement_id: ART30-002
      expected_status: ambiguous
      reason: >
        'Commercially reasonable efforts' to store in EU — not a firm commitment. 'May process
        outside EU where required' with no conditions or notification obligation.
      expected_risk: high

    - requirement_id: ART30-006
      expected_status: missing
      reason: >
        No regulatory cooperation clause. No obligation to cooperate with Finanstilsynet or
        other competent authorities.
      expected_risk: medium

    - requirement_id: ART30-007
      expected_status: missing
      reason: >
        No exit assistance or transition support clause. 30-day data export window does not
        constitute exit assistance under DORA.
      expected_risk: medium

    - requirement_id: ART30-008
      expected_status: ambiguous
      reason: >
        Breach notification 72 hours matches regulatory deadline but leaves no margin for
        financial entity's own assessment. Standard practice requires processor notification
        within 24-48 hours. '72 hours' is a gap indicator for DORA.
      expected_risk: medium

    - requirement_id: ART30-009
      expected_status: na
      reason: "Non-critical function."

    - requirement_id: ART30-010
      expected_status: ambiguous
      reason: >
        Only ISO cert and SOC 2 report available. 'Direct customer audits not feasible' — no
        fallback direct audit right. For non-critical function this is borderline; flag for review.
      expected_risk: medium

    - requirement_id: ART30-013
      expected_status: missing
      reason: >
        BCP/DRP present but 'does not test — testing would be disruptive'. Testing obligation
        explicitly waived. This is a gap regardless of function classification.
      expected_risk: high

  gdpr_findings:
    - requirement_id: ART28-005
      expected_status: ambiguous
      reason: >
        Sub-processors named with 30-day change notification but NO right to object. This satisfies
        the notification obligation but not the objection right under Art. 28(2).
      expected_risk: medium

    - requirement_id: ART28-007
      expected_status: ambiguous
      reason: >
        Breach notification 72 hours matches regulatory deadline but leaves no margin for
        financial entity's own assessment. Standard practice requires processor notification
        within 24-48 hours.
      expected_risk: medium

    - requirement_id: ART28-010
      expected_status: missing
      reason: >
        No flow-down clause imposing same GDPR obligations on sub-processors (Datadog, Zendesk).
        30-day change notification does not constitute flow-down.
      expected_risk: high

    - requirement_id: ART28-011
      expected_status: missing
      reason: >
        Supplier is Dutch (NL = EEA), but uses Datadog (US) and Zendesk (US) as sub-processors.
        No transfer mechanism (SCCs or adequacy decision) identified for US sub-processors.
      expected_risk: critical

contract_05_good:
  supplier: "SecureVault Nordic A/S"
  classification: "critical_important"
  expected_gaps:
    - requirement_id: ART30-010
      expected_status: ambiguous
      reason: >
        Audit right present (Clause 5.1) but notice period is 45 days for planned audits.
        While the contract states exceptions for incidents, 45 days may be considered
        excessive for routine compliance audits under DORA. 30 days is more typical.
        Minor finding — does not constitute a critical gap.
      expected_risk: low

  gdpr_findings: []
  note: "This contract is predominantly compliant. The 45-day audit notice period is the only flagged item."
