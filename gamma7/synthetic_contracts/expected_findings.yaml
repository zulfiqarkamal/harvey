# Expected Findings — Synthetic Contract Test Dataset
# Used to validate the gap analysis engine against known ground truth.
# Version: 1.1 — 2026-11-08
#
# Format per contract:
#   requirement_id: expected ComplianceStatus
#   (only requirements where status is NOT "satisfied" are listed — satisfied is default)

contract_01_cloudhost:
  supplier: "NordCloud Hosting A/S"
  classification: "critical_important"
  expected_gaps:
    - requirement_id: ART30-001
      expected_status: ambiguous
      reason: >
        Sub-contracting clause present but conditions are vague ('material sub-contracting
        arrangements', 'within 30 days of commencement'). No pre-approval requirement,
        no right to object, no list of approved sub-contractors. Insufficient for critical function.
      expected_risk: high

    - requirement_id: ART30-004
      expected_status: ambiguous
      reason: >
        Only one quantitative metric (99.5% uptime). No RTO, RPO, or qualitative standards.
        Review process is 'annually' but no procedure defined.
      expected_risk: medium

    - requirement_id: ART30-005
      expected_status: ambiguous
      reason: >
        Data return clause present but export format is not specified. 60-day window is acceptable.
        Insolvency/resolution scenarios not explicitly addressed.
      expected_risk: medium

    - requirement_id: ART30-008
      expected_status: ambiguous
      reason: >
        Incident notification clause present but timeframe is 'as soon as reasonably practicable'
        — not a defined number of hours. For critical function, this is insufficient.
      expected_risk: high

    - requirement_id: ART30-009
      expected_status: missing
      reason: >
        No TLPT cooperation clause. Contract predates DORA. As a critical/important function,
        TLPT clause is required.
      expected_risk: high

    - requirement_id: ART30-011
      expected_status: ambiguous
      reason: >
        Only one quantitative metric (uptime). No explicit monitoring rights beyond receiving reports.
      expected_risk: medium

    - requirement_id: ART30-013
      expected_status: ambiguous
      reason: >
        BCP present. Annual 'review' referenced but no testing obligation. For critical function,
        testing is mandatory.
      expected_risk: high

  gdpr_findings: []
  note: >
    DPA (Exhibit B, Section 3) explicitly states prior written authorisation + change notification +
    right to object — ART28-005 is SATISFIED. Removed from expected_gaps (v1.1 correction).

contract_02_payment:
  supplier: "PayLink Technologies Ltd"
  classification: "critical_important"
  expected_gaps:
    - requirement_id: ART30-001
      expected_status: missing
      reason: >
        Sub-contracting permitted without prior notice. No approval requirement, no right to object,
        no conditions specified. Supplier merely 'remains responsible'. Critical gap.
      expected_risk: critical

    - requirement_id: ART30-002
      expected_status: ambiguous
      reason: >
        'Multiple locations within the European Union' — no specific countries or facilities named.
        Change notification obligation absent.
      expected_risk: high

    - requirement_id: ART30-005
      expected_status: missing
      reason: >
        No data portability, export, or deletion clause. Contract covers only payment processing;
        no provisions for end-of-contract data handling.
      expected_risk: high

    - requirement_id: ART30-007
      expected_status: missing
      reason: >
        No exit assistance or transition support clause. Contract may be terminated on notice
        but supplier has no obligation to support migration.
      expected_risk: high

    - requirement_id: ART30-008
      expected_status: ambiguous
      reason: >
        Security breach notification is 72 hours — this may not give financial entity enough time
        for its own regulatory reporting. Service outage notification is 'as soon as confirmed'
        (acceptable for operational incidents).
      expected_risk: medium

    - requirement_id: ART30-010
      expected_status: missing
      reason: >
        Audit right limited to receiving PCI DSS ROC. Direct on-site audit explicitly refused.
        DORA requires financial entity and competent authorities to have audit rights.
        Pooled audit reports alone are insufficient without fallback direct access.
      expected_risk: critical

    - requirement_id: ART30-009
      expected_status: missing
      reason: "No TLPT clause. Critical/important function."
      expected_risk: high

    - requirement_id: ART30-013
      expected_status: ambiguous
      reason: >
        BCP/DR present. Testing 'in accordance with PCI DSS requirements' is acceptable for
        PCI but DORA requires explicit testing obligation in the contract.
      expected_risk: medium

  gdpr_findings:
    - requirement_id: ART28-002
      expected_status: missing
      reason: >
        No explicit 'processing only on documented instructions' clause. Section 9.2
        says 'as necessary to provide the Services' — this is processing on own purposes,
        not on controller instructions.
      expected_risk: high

    - requirement_id: ART28-003
      expected_status: missing
      reason: >
        No confidentiality obligation on processor's staff. Contract has no DPA confidentiality
        clause for personnel.
      expected_risk: high

    - requirement_id: ART28-004
      expected_status: missing
      reason: >
        No reference to Art. 32 or equivalent technical/organisational security measures in DPA context.
        General 'appropriate security' without regulatory standard reference.
      expected_risk: high

    - requirement_id: ART28-005
      expected_status: missing
      reason: >
        Sub-processor list 'available on compliance portal' with no change notification right
        or objection mechanism. Insufficient under Art. 28(2).
      expected_risk: high

    - requirement_id: ART28-006
      expected_status: missing
      reason: >
        No data subject rights assistance clause. No mechanism for access, erasure, or
        restriction requests.
      expected_risk: high

    - requirement_id: ART28-008
      expected_status: missing
      reason: >
        No data deletion or return clause on termination.
      expected_risk: high

    - requirement_id: ART28-009
      expected_status: missing
      reason: >
        No audit right under GDPR Art. 28(3)(h). PCI DSS certification is provided but
        no GDPR-specific audit right.
      expected_risk: high

    - requirement_id: ART28-010
      expected_status: missing
      reason: >
        No flow-down clause imposing same GDPR obligations on sub-processors.
      expected_risk: high

    - requirement_id: ART28-011
      expected_status: ambiguous
      reason: >
        'Some processing may involve transfers within the EU' — but supplier is Irish, may use
        processors outside EEA. No transfer mechanism identified.
      expected_risk: high

